services:
  web:
    build: ..
    ports:
      - "80:80"
    depends_on:
      - api
  api:
    image: your-registry/bleem-wechat-api:latest
    environment:
      SERVER_PORT: 8088
      PROFILE_ACTIVE: prod
      MYSQL_IP: mysql
      MYSQL_PORT: 3306
      MYSQL_USERNAME: ${MYSQL_USERNAME}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_IP: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      - mysql
      - redis
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: wx
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
  redis:
    image: redis:7-alpine
volumes:
  mysql-data:
